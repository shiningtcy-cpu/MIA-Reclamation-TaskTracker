  .meta{margin-top:4px;font-size:13px;color:#d6e6f5}

const DISC_EN={'填海/Reclamation':'Reclamation','機坪/Apron':'Apron','土木/Civil':'Civil','建築/Arch':'Architecture','機電/MEP':'MEP','一般事項/General':'General'};
const CAT_KEYS = DATA.categories.map(c=>c.key);
const COLS = {
  EDMS:[
    {key:'ref_no', zh:'流程編號', en:'Ref. No.'},
    {key:'discipline', zh:'範疇', en:'Discipline', type:'discipline'},
    {key:'title',  zh:'工作標題', en:'Work Title', type:'title'},
    {key:'start',  zh:'開始時間', en:'Start Time', type:'date'},
    {key:'deadline',zh:'提交截止時間', en:'Submission Deadline', type:'date'},
    {key:'status', zh:'狀態', en:'Status', type:'status'},
    {key:'remarks', zh:'備註', en:'Remarks', type:'remarks'}
  ],
  Email:[
    {key:'ref_no', zh:'流程編號', en:'Ref. No.'},
    {key:'discipline', zh:'範疇', en:'Discipline', type:'discipline'},
    {key:'title',  zh:'工作標題', en:'Work Title', type:'title'},
    {key:'sender', zh:'發送方', en:'Sender'},
    {key:'start',  zh:'開始時間', en:'Start Time', type:'date'},
    {key:'deadline',zh:'提交截止時間', en:'Submission Deadline', type:'date'},
    {key:'status', zh:'狀態', en:'Status', type:'status'},
    {key:'remarks', zh:'備註', en:'Remarks', type:'remarks'}
  ],
  Letter:[
    {key:'ref_no', zh:'流程編號', en:'Ref. No.'},
    {key:'discipline', zh:'範疇', en:'Discipline', type:'discipline'},
    {key:'title',  zh:'工作標題', en:'Work Title', type:'title'},
    {key:'sender', zh:'發送方', en:'Sender'},
    {key:'start',  zh:'開始時間', en:'Start Time', type:'date'},
    {key:'deadline',zh:'提交截止時間', en:'Submission Deadline', type:'date'},
    {key:'status', zh:'狀態', en:'Status', type:'status'},
    {key:'remarks', zh:'備註', en:'Remarks', type:'remarks'}
  ]
};

const state = {search:'', discipline:null, sort:{}};

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function titleText(it){return (it.title_zh||'')+' '+(it.title_en||'');}
function sortVal(it,key){
  if(key==='title')return titleText(it).toLowerCase();
  if(key==='discipline')return (it.discipline||'').toLowerCase();
  return String(it[key]||'').toLowerCase();
}

/* ---------- Donut geometry ---------- */
function polar(cx,cy,r,a){return [cx+r*Math.cos(a), cy+r*Math.sin(a)];}
function arcPath(cx,cy,R,r,a0,a1){
  const large=(a1-a0)>Math.PI?1:0;
  const [x0,y0]=polar(cx,cy,R,a0),[x1,y1]=polar(cx,cy,R,a1);
  const [x2,y2]=polar(cx,cy,r,a1),[x3,y3]=polar(cx,cy,r,a0);
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${R} ${R} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${r} ${r} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}
function ringPath(cx,cy,R,r){
  return `M ${cx} ${cy-R} A ${R} ${R} 0 1 1 ${cx} ${cy+R} A ${R} ${R} 0 1 1 ${cx} ${cy-R} Z `+
         `M ${cx} ${cy-r} A ${r} ${r} 0 1 0 ${cx} ${cy+r} A ${r} ${r} 0 1 0 ${cx} ${cy-r} Z`;
}
function buildDonut(segs){
  const total=segs.reduce((a,s)=>a+s.value,0);
  const cx=80,cy=80,R=64,r=40,start=-Math.PI/2;
  const seg=(zh,en,val,color,d,fill)=>
    `<g class="seg" data-zh="${zh}" data-en="${en}" data-value="${val}" data-color="${color}">`+
      `<path class="seg-hit" d="${d}" fill="transparent" pointer-events="all"/>`+
      `<path class="seg-vis" d="${d}" fill="${fill}" ${fill==='transparent'?'':'fill-rule="evenodd"'} pointer-events="none"/>`+
    `</g>`;
  let groups='';
  if(total===0){
    groups=seg('無','None','0','#e2e8f0',ringPath(cx,cy,R,r),'#e2e8f0');
  }else if(segs.length===1 || segs.filter(s=>s.value>0).length===1){
    const s=segs.find(x=>x.value>0)||segs[0];
    groups=seg(esc(s.zh),esc(s.en),String(s.value),s.color,ringPath(cx,cy,R,r),s.color);
  }else{
    let a=start;
    segs.forEach(s=>{
      const frac=s.value/total, a1=a+frac*2*Math.PI;
      groups+=seg(esc(s.zh),esc(s.en),String(s.value),s.color,arcPath(cx,cy,R,r,a,a1),s.color);
      a=a1;
    });
  }
  return `<svg viewBox="0 0 160 160" width="190" height="190" class="donut-svg">
    <g class="segs">${groups}</g>
    <text class="dn-center-val"  x="80" y="74" text-anchor="middle">${total>0?total:0}</text>
    <text class="dn-center-cap" x="80" y="94" text-anchor="middle" fill="#6b7c8f">總計 Total</text>
    <text class="dn-center-lz"   x="80" y="82" text-anchor="middle"></text>
    <text class="dn-center-le"   x="80" y="99" text-anchor="middle"></text>
  </svg>`;
}
function legendHTML(segs,total){
  return segs.map((s,i)=>`<div class="lg-item" data-idx="${i}"><span class="dot" style="background:${s.color}"></span><span class="lg-zh">${esc(s.zh)}</span><span class="lg-en">${esc(s.en)}</span><b>${s.value} (${total?Math.round(s.value/total*100):0}%)</b></div>`).join('');
}
function bindDonut(box){
  const segs=[...box.querySelectorAll('.seg')];
  const val=box.querySelector('.dn-center-val');
  const cap=box.querySelector('.dn-center-cap');
  const lz=box.querySelector('.dn-center-lz');
  const le=box.querySelector('.dn-center-le');
  if(!segs.length||!val) return;
  const dVal=val.textContent, dY=val.getAttribute('y');
  function focus(i){
    segs.forEach((g,j)=>{
      const vis=g.querySelector('.seg-vis');
      if(j===i){
        g.parentNode.appendChild(g);   // bring whole segment (incl. visible layer) to front
        vis.setAttribute('transform','translate(80 80) scale(1.08) translate(-80 -80)');
        vis.style.filter='drop-shadow(0 3px 5px rgba(0,0,0,.35))';
      }else{ vis.removeAttribute('transform'); vis.style.filter=''; }
    });
    const s=segs[i].dataset;
    val.textContent=s.value; val.setAttribute('y','60'); val.style.fontSize='20px';
    lz.textContent=s.zh; lz.style.fill=s.color; lz.style.display='block';
    le.textContent=s.en; le.style.fill=s.color; le.style.display='block';
    cap.style.display='none';
    box.querySelectorAll('.lg-item').forEach((li,j)=>li.classList.toggle('active',j===i));
  }
  function reset(){
    segs.forEach(g=>{const vis=g.querySelector('.seg-vis');vis.removeAttribute('transform');vis.style.filter='';});
    val.textContent=dVal; val.setAttribute('y',dY); val.style.fontSize='';
    lz.style.display='none'; lz.style.fill=''; le.style.display='none'; le.style.fill='';
    cap.style.display='';
    box.querySelectorAll('.lg-item').forEach(li=>li.classList.remove('active'));
  }
  segs.forEach((g,i)=>{g.addEventListener('mouseenter',()=>focus(i));});
  const svg=box.querySelector('svg'); if(svg) svg.addEventListener('mouseleave',reset);
  box.querySelectorAll('.lg-item').forEach((li,i)=>{li.addEventListener('mouseenter',()=>focus(i));li.addEventListener('mouseleave',reset);});
}

/* ---------- Dashboard ---------- */
function renderDashboard(groups){
  const total=groups.reduce((a,g)=>a+g.items.length,0);
  const allItems=groups.flatMap(g=>g.items);
  const cnt=cls=>(allItems.filter(it=>it.status===cls).length);
  const cOk=cnt('進行中'), cLag=cnt('滯後'), cSev=cnt('嚴重滯後');

  const kpis=[
    {v:total, l:'總待辦事項', en:'Total Tasks', cls:''},
    {v:cOk,   l:'進行中',     en:'On Track',   cls:'ok'},
    {v:cLag,  l:'滯後',       en:'Delayed',    cls:'accent'},
    {v:cSev,  l:'嚴重滯後',   en:'Critically Delayed', cls:'warn'}
  ];
  document.getElementById('kpiGrid').innerHTML=kpis.map(k=>
    `<div class="kpi ${k.cls}"><div class="v">${k.v}</div><div class="l">${k.l}<span class="en">${k.en}</span></div></div>`).join('');

  // Category donut
  const catSegs=CAT_KEYS.map(k=>{const g=groups.find(x=>x.key===k);const meta=DATA.categories.find(c=>c.key===k);return {zh:k,en:meta?meta.en:'',value:g?g.items.length:0,color:COLORS[k]};});
  const catTotal=catSegs.reduce((a,s)=>a+s.value,0);
  document.getElementById('donutCat').innerHTML=buildDonut(catSegs);
  document.getElementById('legendCat').innerHTML=legendHTML(catSegs,catTotal);

  // Status donut (exclude 未設定 / Not Set)
  const stOrder=['進行中','滯後','嚴重滯後'];
  const stSegs=stOrder.map(s=>({zh:s,en:ST_EN[s],value:cnt(s),color:ST_COLOR[s]}));
  const stTotal=cOk+cLag+cSev;
  document.getElementById('donutStatus').innerHTML=buildDonut(stSegs);
  document.getElementById('legendStatus').innerHTML=legendHTML(stSegs,stTotal);

  // Discipline donut
  const discMap={};
  allItems.forEach(it=>{const d=it.discipline||''; discMap[d]=(discMap[d]||0)+1;});
  const discSegs=Object.keys(DISC_COLOR).map(d=>{const zh=d.split('/')[0],en=d.split('/')[1]||DISC_EN[d];return {zh,en,value:discMap[d]||0,color:DISC_COLOR[d]};}).filter(s=>s.value>0);
  if(discMap['']){ discSegs.push({zh:'未分類',en:'Unassigned',value:discMap[''],color:'#b7c4d1'}); }
  const discTotal=discSegs.reduce((a,s)=>a+s.value,0);
  document.getElementById('donutDisc').innerHTML=buildDonut(discSegs);
  document.getElementById('legendDisc').innerHTML=legendHTML(discSegs,discTotal);

  bindDonut(document.getElementById('cardCat'));
  bindDonut(document.getElementById('cardStatus'));
  bindDonut(document.getElementById('cardDisc'));
}

/* ---------- Sections ---------- */
function renderSections(groups){
  const host=document.getElementById('sections');
  let html='';
  groups.forEach(g=>{
    if(!g.items.length){return;}
    const meta=DATA.categories.find(c=>c.key===g.key);
    let rows=g.items.map(it=>{
      const cells=COLS[g.key].map(col=>cellFor(col,it)).join('');
      return `<tr>${cells}</tr>`;
    }).join('');
    if(!rows) rows=`<tr><td colspan="${COLS[g.key].length}" class="no-res">無符合項目 No matching items</td></tr>`;
    const heads=COLS[g.key].map(col=>{
      const s=state.sort[g.key];
      const arr=(s&&s.key===col.key)?(s.dir>0?'▲':'▼'):'';
      const cls=col.key==='title'?' col-title':'';
      return `<th class="${cls}" data-cat="${g.key}" data-key="${col.key}"><span class="th-zh">${col.zh}</span><span class="th-en">${col.en}</span><span class="arr">${arr}</span></th>`;
    }).join('');
    html+=`<section class="cat" id="sec-${g.key}">
      <div class="cat-head"><span class="cat-badge" style="background:${COLORS[g.key]}"></span>
        <h2>${g.key} <span class="en">${esc(meta.en)}</span></h2>
        <span class="cat-count">${g.items.length} 項 items</span></div>
      <div class="tbl-scroll"><table>
        <thead><tr>${heads}</tr></thead><tbody>${rows}</tbody>
      </table></div></section>`;
  });
  host.innerHTML=html;
  // bind sort
  host.querySelectorAll('th[data-key]').forEach(th=>{
    th.addEventListener('click',()=>{
      const cat=th.dataset.cat,key=th.dataset.key;
      const s=state.sort[cat];
      state.sort[cat]=(s&&s.key===key)?{key,dir:-s.dir}:{key,dir:1};
      const g=groups.find(x=>x.key===cat);
      g.items.sort((a,b)=>{const va=sortVal(a,key),vb=sortVal(b,key);return va<vb?-1*state.sort[cat].dir:va>vb?1*state.sort[cat].dir:0;});
      renderSections(groups);renderDashboard(groups);
    });
  });
}

function statusClass(v){
  if(v==='嚴重滯後') return 'st-sev';
  if(v==='滯後') return 'st-lag';
  if(v==='進行中') return 'st-ok';
  if(v==='未設定') return 'st-na';
  return '';
}
function cellFor(col,it){
  if(col.type==='title'){
    let h='';
    if(it.title_zh) h+=`<div class="zh">${esc(it.title_zh)}</div>`;
    if(it.title_en) h+=`<div class="en">${esc(it.title_en)}</div>`;
    if(!it.title_zh&&!it.title_en) h=`<span class="miss">—</span>`;
    return `<td class="col-title">${h}</td>`;
  }
  if(col.key==='ref_no'){
    return `<td class="ref">${it.ref_no?esc(it.ref_no):'<span class="miss">—</span>'}</td>`;
  }
  if(col.key==='sender'){
    return `<td>${it.sender?esc(it.sender):'<span class="miss">—</span>'}</td>`;
  }
  if(col.type==='date'){
    const v=it[col.key];
    return `<td class="date ${v?'':'empty'}">${v?esc(v):'<span class="miss">—</span>'}</td>`;
  }
  if(col.type==='status'){
    const v=it.status||'';
    const cls=statusClass(v);
    if(!v) return `<td class="status-cell"><span class="status-badge ${cls}">—</span></td>`;
    return `<td class="status-cell"><span class="status-badge ${cls}"><span class="zh">${esc(v)}</span><span class="en">${esc(ST_EN[v]||'')}</span></span></td>`;
  }
  if(col.type==='discipline'){
    const v=it.discipline||'';
    if(!v) return `<td><span class="miss">—</span></td>`;
    const dcol=DISC_COLOR[v]||'#5B7C99';
    const zh=v.split('/')[0]; const en=v.split('/')[1]||(DISC_EN[v]||'');
    return `<td><span class="disc-tag" style="background:${dcol}"><span class="dz">${esc(zh)}</span><span class="de">${esc(en)}</span></span></td>`;
  }
  if(col.type==='remarks'){
    const v=it.remarks||'';
    return `<td>${v?esc(v):'<span class="miss">—</span>'}</td>`;
  }
  return `<td>${esc(it[col.key]||'')}</td>`;
}

/* ---------- Nav ---------- */
function renderNav(){
  const host=document.getElementById('nav');
  let html=`<a href="#dashboard">整體概覽 <span class="en">Overview</span></a>`;
  CAT_KEYS.forEach(k=>{
    const meta=DATA.categories.find(c=>c.key===k);
    html+=`<a href="#sec-${k}">${k} <span class="en">${esc(meta.en.split(' ')[0])}</span></a>`;
  });
  host.innerHTML=html;
}

/* ---------- Init ---------- */
function getFiltered(){
  const q=state.search.trim().toLowerCase();
  const disc=state.discipline;
  return DATA.categories.map(c=>{
    let items=c.items.map(it=>({...it,_cat:c.key}));
    if(disc) items=items.filter(it=>it.discipline===disc);
    if(q){
      items=items.filter(it=>(it.ref_no+' '+titleText(it)+' '+(it.sender||'')+' '+
        (it.discipline||'')+' '+(it.status||'')+' '+(it.remarks||'')).toLowerCase().includes(q));
    }
    return {...c,items};
  });
}
function renderDiscFilters(){
  const host=document.getElementById('discFilters');
  const present=new Set();
  DATA.categories.forEach(c=>c.items.forEach(it=>{if(it.discipline)present.add(it.discipline);}));
  const list=['',...[...present]];
  host.innerHTML=`<span class="fl-label">範疇篩選 / Filter by Discipline</span>`+
    list.map(d=>{
      const active=state.discipline===d;
      const zh=d?d.split('/')[0]:'全部';
      const en=d?(d.split('/')[1]||(DISC_EN[d]||'')):'All';
      const col=d?(DISC_COLOR[d]||'#5B7C99'):'#145da0';
      const style=active?`background:${col};border-color:${col};color:#fff`
                        :`background:transparent;color:${col};border-color:${col}`;
      return `<span class="chip ${active?'active':''}" data-disc="${d}" style="${style}"><span class="zh">${esc(zh)}</span><span class="en-sub">${esc(en)}</span></span>`;
    }).join('');
  host.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click',()=>{state.discipline=ch.dataset.disc||null;render();});
  });
}
function render(){const g=getFiltered();renderDashboard(g);renderDiscFilters();renderSections(g);}
function init(){
  document.getElementById('updated').textContent=DATA.updated;
  renderNav();
  render();
  document.getElementById('search').addEventListener('input',e=>{state.search=e.target.value;render();});
}
init();
</script>
